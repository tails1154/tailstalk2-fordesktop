name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create AppX signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString -String "stoat-ci" -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=B040CC7E-0016-4AF5-957F-F8977A6CFA3B" `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -CertStoreLocation Cert:\CurrentUser\My
          Export-PfxCertificate `
            -Cert $certificate `
            -FilePath "$env:RUNNER_TEMP\stoat-ci.pfx" `
            -Password $password

      - name: Build distributables
        run: pnpm make
        env:
          APPX_DEV_CERT: ${{ runner.temp }}\stoat-ci.pfx
          APPX_CERT_PASS: stoat-ci
          SKIP_APPX: "1"

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download distributables
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: find release-assets -type f -print | sort

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          while IFS= read -r asset; do
            gh release upload "$TAG" "$asset"
          done < <(find release-assets -type f | sort)
