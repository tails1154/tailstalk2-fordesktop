on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build App
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create AppX signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString -String "stoat-ci" -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=B040CC7E-0016-4AF5-957F-F8977A6CFA3B" `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -CertStoreLocation Cert:\CurrentUser\My
          Export-PfxCertificate `
            -Cert $certificate `
            -FilePath "$env:RUNNER_TEMP\stoat-ci.pfx" `
            -Password $password

      - name: Build
        run: pnpm make
        env:
          APPX_DEV_CERT: ${{ runner.temp }}\stoat-ci.pfx
          APPX_CERT_PASS: stoat-ci
          SKIP_APPX: "1"

      - name: Upload Forge distributables
        uses: actions/upload-artifact@v4
        with:
          name: stoat-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error
